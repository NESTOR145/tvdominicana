name: Agregar canales online desde lista remota

on:
  schedule:
    # Desplazado 2 horas respecto a la limpieza para no coincidir.
    # Limpieza: 00:00, 06:00, 12:00, 18:00 UTC
    # Agregar : 02:00, 08:00, 14:00, 20:00 UTC
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # MISMO grupo que el workflow de limpieza:
  # si uno está corriendo, el otro espera a que termine.
  group: canales
  cancel-in-progress: false

jobs:
  agregar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar agregación
        run: python scripts/agregar_canales.py

      - name: Guardar cambios (robusto)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Traer lo último del remoto antes de nada
          git fetch origin main

          # Rebase para integrar cambios que hicieras tú mientras corría el script
          git pull --rebase --autostash origin main || true

          git add -A

          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi

          git commit -m "Auto: agregar canales online desde lista remota"

          # Reintentar el push hasta 3 veces con rebase intermedio
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push correcto en intento $i."
              exit 0
            fi
            echo "Push falló. Reintentando con rebase..."
            git fetch origin main
            git pull --rebase --autostash origin main || true
            sleep 5
          done

          echo "No se pudo hacer push tras 3 intentos."
          exit 1
