name: Limpiar canales caídos

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar limpieza
        run: python scripts/limpiar_canales.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tvdominicana.json estado_tvdominicana.json canales_eliminados.log
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Auto: limpiar canales caídos"
            git push
          fi
