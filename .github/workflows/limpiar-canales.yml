
name: Limpiar canales caídos

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo DRY_RUN (no modifica archivos)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: canales
  cancel-in-progress: false

jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check "requests==2.32.3"

      - name: Ejecutar limpieza
        env:
          PYTHONUNBUFFERED: "1"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/limpiar_canales.py

      - name: Subir resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limpiar-resultado
          path: |
            tvdominicana.json
            estado_tvdominicana.json
            canales_eliminados.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar cambios
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- tvdominicana.json estado_tvdominicana.json canales_eliminados.log

          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi

          git commit -m "Auto: limpiar canales caídos"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push correcto en intento $i."
              exit 0
            fi

            echo "Push falló; actualizando main e intentando rebase."
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflicto al integrar cambios remotos. No se fuerza el push."
              exit 1
            fi

            sleep 3
          done

          echo "::error::No se pudo hacer push tras 3 intentos."
          exit 1
